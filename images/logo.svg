<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" role="img" aria-label="Molina Salón de Belleza">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&amp;family=Montserrat:wght@500&amp;display=swap');
      .name { font-family: 'Cormorant Garamond', Didot, 'Bodoni MT', Georgia, serif; font-weight: 500; font-size: 78px; letter-spacing: 12px; fill: #111; }
      .sub  { font-family: Montserrat, 'Helvetica Neue', Arial, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 5px; fill: #6b6b6b; }
    </style>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f2f2"/>
      <stop offset=".5" stop-color="#a9a9a9"/>
      <stop offset="1" stop-color="#d9d9d9"/>
    </linearGradient>
  </defs>

  <!-- Monograma: arco con M -->
  <g transform="translate(14 14)">
    <path d="M0 132V56a56 56 0 0 1 112 0v76z" fill="#111"/>
    <path d="M6 132V56a50 50 0 0 1 100 0v76" fill="none" stroke="url(#silver)" stroke-width="1.5"/>
    <path d="M30 112V54l26 34 26-34v58" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M56 18l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="url(#silver)"/>
  </g>

  <!-- Nombre -->
  <text x="152" y="96" class="name">MOLINA</text>
  <line x1="158" y1="122" x2="228" y2="122" stroke="#a9a9a9" stroke-width="1"/>
  <text x="340" y="127" class="sub" text-anchor="middle">SALÓN DE BELLEZA</text>
  <line x1="452" y1="122" x2="506" y2="122" stroke="#a9a9a9" stroke-width="1"/>
</svg>
